# Installer ISO (ADR-0017, ADR-0036, ADR-0025): UEFI, whole-disk, self-contained.
# ostreecontainer is added by bootc-image-builder (embedded Host image, no registry).
[customizations.installer.modules]
disable = [
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription",
]

[customizations.installer.kickstart]
contents = '''
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --lock
firstboot --disable
reboot --eject
%include /tmp/fwos-disk.ks

%pre --erroronfail --interpreter=/bin/bash --log=/tmp/fwos-pre.log
set -euo pipefail
disks=()
while read -r name type ro rm; do
  case "$name" in
    zram*|loop*|ram*|sr*) continue ;;
  esac
  if [ "$type" = disk ] && [ "$ro" = 0 ] && [ "$rm" != 1 ]; then
    disks+=("$name")
  fi
done < <(lsblk -dn -o NAME,TYPE,RO,RM)
n=${#disks[@]}
if [ "$n" -eq 0 ]; then
  echo "FWOS Installer: no writable disk" > /dev/console
  exit 1
fi
exec </dev/console >/dev/console 2>/dev/console
print_wipe_notice() {
  local d="$1"
  local sz
  sz=$(lsblk -dn -o SIZE "/dev/$d" 2>/dev/null || echo "?")
  echo "FWOS Installer: /dev/$d ($sz)"
  echo "The entire disk will be erased and replaced with the Host disk layout"
  echo "(firmware boot plus one root)."
}
read_yes() {
  local d="$1"
  local ans
  echo -n "Type yes to wipe /dev/$d: "
  read -r ans || true
  ans="${ans%$'\r'}"
  ans="${ans,,}"
  [ "$ans" = yes ]
}
pick=""
if [ "$n" -eq 1 ]; then
  pick="${disks[0]}"
  print_wipe_notice "$pick"
  until read_yes "$pick"; do
    :
  done
else
  while [ -z "$pick" ]; do
    echo "FWOS Installer: pick a disk to wipe"
    i=1
    for d in "${disks[@]}"; do
      sz=$(lsblk -dn -o SIZE "/dev/$d" 2>/dev/null || echo "?")
      echo "  $i) /dev/$d ($sz)"
      i=$((i + 1))
    done
    while true; do
      echo -n "Disk number: "
      read -r num || true
      num="${num%$'\r'}"
      case "$num" in
        ''|*[!0-9]*) continue ;;
      esac
      if [ "$num" -ge 1 ] && [ "$num" -le "$n" ]; then
        break
      fi
    done
    candidate="${disks[$((num - 1))]}"
    print_wipe_notice "$candidate"
    if read_yes "$candidate"; then
      pick="$candidate"
    fi
  done
fi
cat > /tmp/fwos-disk.ks <<EOF
ignoredisk --only-use=${pick}
zerombr
clearpart --all --initlabel --disklabel=gpt
reqpart --add-boot
part / --grow --fstype=ext4
bootloader --boot-drive=${pick}
EOF
%end
'''
